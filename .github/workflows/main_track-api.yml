# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - track-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C561CD3A8EC24E2697AB052B6D7D3D00 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FE9DCF1F98384C0B89B390E7F750E919 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1F0A16E5BCE74D0A8B46B7A63D6BB3C1 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'track-api'
          slot-name: 'Production'
          
          # This is the crucial line that tells Azure to only look in the backend folder.
          # Azure's build system (Oryx) will automatically find your requirements.txt
          # and app.py inside this folder.
          package: ./backend
          