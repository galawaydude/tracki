# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - tracki-api-pavan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_35F30A0B90E44FBCA7F93D931DD5620A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6FD06B0AEE0F4BDA98792B16DE7DCCF3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D58B3E419C34AF7B5772D7B8257E694 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tracki-api-pavan'
          slot-name: 'Production'
          # This is the crucial line that tells Azure to only look in the backend folder.
          # Azure's build system will automatically find your requirements.txt in this folder.
          package: ./backend
          